[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -v
    --tb=short
    --color=yes
    -ra

markers =
    asyncio: mark test as async
    sync: mark test as sync
    slow: slow running test
    fast: fast running test